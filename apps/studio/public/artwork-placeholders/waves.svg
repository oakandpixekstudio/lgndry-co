  <path d="M0 190 C 130 120, 250 110, 360 150 C 470 190, 580 200, 700 140 C 780 100, 850 105, 900 120 L900 250 L0 250 Z" fill="url(#r2)"/>
  <path d="M0 225 C 150 190, 280 195, 400 215 C 520 235, 640 225, 760 200 C 820 188, 870 188, 900 192 L900 250 L0 250 Z" fill="url(#r3)"/>
  <rect width="900" height="250" filter="url(#grain)"/>
