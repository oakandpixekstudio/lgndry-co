<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e8e4"/>
      <stop offset="1" stop-color="#bdbcb6"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f2ee"/>
