function drawerRender(){if(!drawerEntity)return;const {type,id}=drawerEntity;document.getElementById('drawerHead').textContent=type==='customer'?'CUSTOMER / PROFILE':type==='order'?'ORDER / FULFILMENT':type==='edition'?'ARTWORK / EDITION':'CAMPAIGN / DRAFT';const body=document.getElementById('drawerContent');if(type==='customer'){const c=customer(id);if(!c)return;const related=state.orders.filter(o=>o.customerId===id);body.innerHTML=`<div class="drawer-eyebrow">RELATIONSHIP / ${safe(c.segment).toUpperCase()}</div><h2 class="drawer-title">${safe(c.name)}</h2><div class="muted" style="font-size:12px">${safe(c.email)} &nbsp; / &nbsp; ${safe(c.city)}</div><div class="drawer-facts"><div><small>LIFETIME SPEND</small><strong>${cash(c.spent)}</strong></div><div><small>TOTAL ORDERS</small><strong>${c.count}</strong></div><div><small>COLLECTOR SINCE</small><strong>${safe(c.joined)}</strong></div><div><small>RELATIONSHIP</small><strong>${safe(c.segment)}</strong></div></div><div class="drawer-section"><h4>PROFILE & PREFERENCES</h4><p class="muted" style="font-size:11px;line-height:1.6;margin:0 0 17px">Marketing consent: not established in this prototype. Do not use these segments as permission to send marketing.</p><div class="field"><label>Relationship segment</label><select class="drawer-select" id="segmentSelect">${['VIP','Repeat','First-time','At-risk'].map(x=>`<option ${c.segment===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Studio notes</label><textarea class="note-area" id="customerNote" placeholder="Add private studio notes">${safe(c.note)}</textarea></div><button class="button mini" data-save-customer="${c.id}">SAVE PROFILE ${icon('check',13)}</button></div><div class="drawer-section"><h4>ORDER HISTORY</h4>${related.length?related.map(o=>`<button class="detail-row" style="width:100%;text-align:left" data-order="${o.id}"><span>#${safe(o.id)} / ${safe(artwork(o.artworkId)?.name||'')}</span><span>${cash(o.price)} ${icon('chevron',13)}</span></button>`).join(''):'<div class="muted" style="font-size:11px">No orders in the sample data.</div>'}</div><div class="drawer-section"><h4>RELATIONSHIP HISTORY</h4><div class="timeline"><div class="timeline-item">Profile last active<small>${safe(c.last)}</small></div><div class="timeline-item">Joined the LGNDRY collector community<small>${safe(c.joined)}</small></div></div></div>`}
if(type==='order'){const o=state.orders.find(x=>x.id===id);if(!o)return;const c=customer(o.customerId),a=artwork(o.artworkId);body.innerHTML=`<div class="drawer-eyebrow">ORDER / ${safe(o.date)} &nbsp; / &nbsp; ${safe(o.status).toUpperCase()}</div><h2 class="drawer-title">#${safe(o.id)}</h2><div class="muted" style="font-size:12px">${safe(c?.name||'Unknown')} &nbsp; / &nbsp; ${cash(o.price)}</div><div class="detail-art">${article(a)}</div><div style="font-family:var(--serif);font-style:italic;font-size:27px;text-align:center;margin:0 0 25px">${safe(a?.name||'Artwork')}</div><div class="drawer-section"><h4>ORDER INFORMATION</h4>${[['Collector',c?.name||'Unknown'],['Print size',o.size],['Frame',o.frame],['Edition',o.edition||'To be assigned'],['Payment','Demo record / not verified'],['Delivery',o.delivery],['Tracking',o.tracking||'Not available']].map(([k,v])=>`<div class="detail-row"><span>${safe(k)}</span><span>${safe(v)}</span></div>`).join('')}</div><div class="drawer-section"><h4>FULFILMENT WORKFLOW</h4><div class="field"><label>Order status</label><select id="orderStatus" class="drawer-select">${['Pending payment','In production','Ready to ship','Dispatched','Delivered'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tracking reference (optional)</label><input id="orderTracking" class="drawer-select" value="${safe(o.tracking)}" placeholder="Courier reference"></div><div class="drawer-button-row"><button class="button" data-save-order="${o.id}">UPDATE ORDER ${icon('check',14)}</button><button class="button secondary" data-customer="${safe(c?.id||'')}">VIEW COLLECTOR ${icon('arrow',14)}</button></div><div style="font-size:10px;color:#8a8a84;line-height:1.7;margin-top:16px">Workflow changes are simulated. A production system must verify payment and atomically assign edition numbers.</div></div>`}
if(type==='edition'){const a=artwork(id);if(!a)return;body.innerHTML=`<div class="drawer-eyebrow">${safe(a.sku)} / ${safe(a.type).toUpperCase()}</div><h2 class="drawer-title">${safe(a.name)}</h2><div style="height:310px;padding:22px;background:#e8e7e2;margin:23px 0">${article(a)}</div><div class="drawer-facts"><div><small>EDITION CAP</small><strong>${a.total}</strong></div><div><small>COPIES ALLOCATED</small><strong>${a.sold}</strong></div><div><small>AVAILABLE</small><strong>${Math.max(0,a.total-a.sold)}</strong></div><div><small>STARTING PRICE</small><strong>${cash(a.price)}</strong></div></div><div class="drawer-section"><h4>EDITION PROGRESS</h4><div class="progress" style="margin:15px 0;height:5px"><span style="width:${Math.min(100,a.sold/a.total*100)}%"></span></div><div class="detail-row"><span>Numbered copies</span><span>${a.sold} / ${a.total}</span></div><div class="detail-row"><span>Unique catalogue ID</span><span>${safe(a.sku)}</span></div><div class="detail-row"><span>Print availability</span><span>${a.sold>=a.total?'SOLD OUT':'AVAILABLE'}</span></div></div><div class="drawer-section"><h4>COLLECTION MANAGEMENT</h4><p style="font-size:12px;line-height:1.8;color:#666">In a production build, the edition register should maintain a unique certificate ID, edition number, print specification, owner and fulfilment history for every copy.</p><button class="button secondary mini" data-nav="orders">OPEN ORDERS ${icon('arrow',14)}</button></div>`}

function openModal(type){let forms={customer:{caption:'NEW RELATIONSHIP',title:'Add a collector.',fields:`<div class="form-grid"><div class="field"><label>First name</label><input name="first" required maxlength="70" placeholder="First name"></div><div class="field"><label>Last name</label><input name="last" required maxlength="70" placeholder="Last name"></div></div><div class="form-grid"><div class="field"><label>Email address</label><input name="email" type="email" required maxlength="150" placeholder="name@example.com"></div><div class="field"><label>Location</label><input name="city" required maxlength="90" placeholder="City"></div></div><div class="field"><label>Relationship</label><select name="segment"><option>First-time</option><option>Repeat</option><option>VIP</option><option>At-risk</option></select></div>`},order:{caption:'NEW ORDER / SAMPLE',title:'Create an order.',fields:`<div class="field"><label>Collector</label><select name="customerId" required>${state.customers.map(c=>`<option value="${safe(c.id)}">${safe(c.name)}</option>`).join('')}</select></div><div class="field"><label>Artwork</label><select name="artworkId" required>${state.artworks.filter(a=>a.sold<a.total).map(a=>`<option value="${safe(a.id)}">${safe(a.name)} / ${cash(a.price)} / ${a.total-a.sold} left</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Print size</label><select name="size"><option>A3</option><option>A2</option><option>A1</option></select></div><div class="field"><label>Framing</label><select name="frame"><option>Unframed</option><option>Natural</option><option>Black</option></select></div></div><div class="field"><label>Delivery</label><select name="delivery"><option>Standard courier</option><option>Studio collection</option></select></div><p class="muted" style="line-height:1.6;font-size:11px">Creates a pending-payment sample record. It does not charge the customer or allocate a print edition.</p>`},edition:{caption:'CATALOGUE / SAMPLE',title:'Add an artwork.',fields:`<div class="field"><label>Artwork title</label><input name="name" required maxlength="90" placeholder="Artwork title"></div><div class="form-grid"><div class="field"><label>Category</label><select name="type"><option>Landscape</option><option>Documentary</option><option>Portraiture</option><option>Movement</option><option>Architecture</option><option>Abstract</option></select></div><div class="field"><label>Edition cap</label><input name="total" type="number" min="1" max="999" required value="25"></div></div><div class="field"><label>Base price (ZAR)</label><input name="price" type="number" min="1" max="10000000" required value="4500"></div><p class="muted" style="font-size:11px">Creates a demonstration catalogue entry only; no live store listing is published.</p>`},campaign:{caption:'AUDIENCE / CAMPAIGN',title:'New correspondence.',fields:`<div class="field"><label>Campaign name</label><input name="name" required maxlength="100" placeholder="Collector letter / Edition preview"></div><div class="field"><label>Audience</label><select name="segment"><option>VIP</option><option>Repeat</option><option>First-time</option><option>At-risk</option></select></div><div class="field"><label>Internal brief</label><textarea name="description" maxlength="800" placeholder="Purpose and message direction"></textarea></div>`}};const f=forms[type];if(!f)return;const html=`<div class="modal-top"><span class="caps muted">${f.caption}</span><button type="button" class="close-icon" id="modalClose">${icon('close',19)}</button></div><h2>${f.title}</h2><form id="creationForm" data-type="${type}">${f.fields}<div class="form-actions"><span class="form-hint">Saved locally in this demonstration.</span><button class="button" type="submit">${icon('plus',14)} CREATE ${type.toUpperCase()}</button></div></form>`;document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('open');document.getElementById('modalWrap').setAttribute('aria-hidden','false');setTimeout(()=>document.querySelector('#creationForm input')?.focus(),0)}
function createForm(form){const kind=form.dataset.type,d=Object.fromEntries(new FormData(form).entries());if(kind==='customer'){const id='c'+Date.now();let name=(d.first+' '+d.last).trim();state.customers.unshift({id,name,email:d.email,city:d.city,segment:d.segment,count:0,spent:0,last:'18 Nov 2026',joined:'Nov 2026',note:''});save();closeModal();customerFilter='All';setView('customers');toast('Collector added to demonstration workspace.');openDrawer('customer',id)}
if(kind==='order'){const a=artwork(d.artworkId);if(!a||a.sold>=a.total){toast('No unallocated copies available.');return}const sequence=Math.max(...state.orders.map(o=>Number(o.id.split('-')[1])||0),1183)+1;const id='LG-'+sequence;const price=a.price+(d.size==='A2'?1350:d.size==='A1'?3100:0)+(d.frame==='Black'?1450:d.frame==='Natural'?1750:0);state.orders.unshift({id,customerId:d.customerId,artworkId:d.artworkId,price,status:'Pending payment',date:'18 Nov 2026',size:d.size,frame:d.frame,edition:'',delivery:d.delivery,tracking:''});save();closeModal();orderFilter='All';setView('orders');toast('Demo order created. No payment was made.');openDrawer('order',id)}
if(kind==='edition'){const id='a'+Date.now(),sku='LG-'+String(state.artworks.length+1).padStart(3,'0');state.artworks.unshift({id,name:d.name,type:d.type,price:Number(d.price),total:Number(d.total),sold:0,visual:['road','gather','form','place','light','still'][state.artworks.length%6],sku});save();closeModal();setView('editions');toast('Artwork added to the demo catalogue.');openDrawer('edition',id)}
if(kind==='campaign'){const id='m'+Date.now();state.campaigns.unshift({id,name:d.name,segment:d.segment,status:'Draft',description:d.description,updated:'18 Nov 2026'});save();closeModal();setView('campaigns');toast('Campaign draft created.');openDrawer('campaign',id)}}

function searchRecords(q){q=q.trim().toLowerCase();if(!q){document.getElementById('searchResults').innerHTML='<p style="padding:25px;color:#888;font-size:12px">Search sample collectors, orders and artworks.</p>';return}let found=[...state.customers.filter(c=>`${c.name} ${c.email} ${c.city}`.toLowerCase().includes(q)).slice(0,6).map(c=>({type:'customer',id:c.id,title:c.name,sub:`${c.city} / ${c.email}`})),...state.orders.filter(o=>`${o.id} ${customer(o.customerId)?.name} ${artwork(o.artworkId)?.name}`.toLowerCase().includes(q)).slice(0,6).map(o=>({type:'order',id:o.id,title:'#'+o.id,sub:`${customer(o.customerId)?.name} / ${cash(o.price)}`})),...state.artworks.filter(a=>`${a.name} ${a.sku} ${a.type}`.toLowerCase().includes(q)).slice(0,6).map(a=>({type:'edition',id:a.id,title:a.name,sub:`${a.sku} / ${a.type}`}))].slice(0,12);document.getElementById('searchResults').innerHTML=found.length?found.map(x=>`<button class="search-result" data-search-type="${x.type}" data-search-id="${safe(x.id)}"><span><strong>${safe(x.title)}</strong><small>${safe(x.sub)}</small></span><span class="search-result-label">${x.type.toUpperCase()} ${icon('chevron',15)}</span></button>`).join(''):'<p style="padding:25px;color:#888;font-size:12px">No results in the demo data.</p>'}
function updateOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const status=document.getElementById('orderStatus').value,tracking=document.getElementById('orderTracking').value.trim().slice(0,80),a=artwork(o.artworkId);if(o.status==='Pending payment'&&status!=='Pending payment'&&!o.edition){if(a.sold>=a.total){toast('Cannot allocate: edition is sold out.');return}a.sold++;o.edition=String(a.sold).padStart(2,'0')+' / '+String(a.total).padStart(2,'0')}o.status=status;o.tracking=tracking;save();render();drawerRender();toast('Order updated locally. Payment is not verified.');}

function saveCampaign(id){const m=state.campaigns.find(x=>x.id===id);if(!m)return;m.description=document.getElementById('campaignDescription').value.slice(0,800);save();render();drawerRender();toast('Campaign draft saved. Nothing was sent.');}
function resetDemo(){if(!window.confirm('Restore all fictional sample records? This will discard changes made in this browser.'))return;state=clone(seed);save();render();toast('Demo data restored.');}
function delegatedClick(e){const x=e.target.closest('button,[data-customer],[data-order],[data-edition],[data-campaign],[data-enquiry]');if(!x)return;const nav=x.closest('[data-nav]');if(nav){closeDrawer();setView(nav.dataset.nav);return}if(x.dataset.customer){closeDrawer();openDrawer('customer',x.dataset.customer);return}if(x.dataset.order){closeDrawer();openDrawer('order',x.dataset.order);return}if(x.dataset.edition){closeDrawer();openDrawer('edition',x.dataset.edition);return}if(x.dataset.campaign){openDrawer('campaign',x.dataset.campaign);return}if(x.dataset.enquiry){selectedEnquiry=x.dataset.enquiry;render();return}if(x.dataset.create){openModal(x.dataset.create);return}if(x.dataset.cfilter){customerFilter=x.dataset.cfilter;render();return}if(x.dataset.ofilter){orderFilter=x.dataset.ofilter;render();return}if(x.dataset.saveCustomer){saveProfile(x.dataset.saveCustomer);return}if(x.dataset.saveOrder){updateOrder(x.dataset.saveOrder);return}if(x.dataset.saveDraft){saveDraft(x.dataset.saveDraft);return}if(x.dataset.resolve){resolveEnquiry(x.dataset.resolve);return}if(x.dataset.saveCampaign){saveCampaign(x.dataset.saveCampaign);return}if(x.id==='resetDemo'){resetDemo();return}}
document.addEventListener('click',delegatedClick);document.addEventListener('submit',e=>{if(e.target.id==='creationForm'){e.preventDefault();createForm(e.target)}});document.addEventListener('input',e=>{if(e.target.id==='customerSearch'){customerQuery=e.target.value;document.getElementById('customersRows').innerHTML=customerList()}if(e.target.id==='orderSearch'){orderQuery=e.target.value;document.getElementById('ordersRows').innerHTML=orderList()}if(e.target.id==='editionSearch'){editionQuery=e.target.value;document.getElementById('editionGallery').innerHTML=editionList()}if(e.target.id==='searchInput'){searchRecords(e.target.value)}});
document.getElementById('drawerClose').innerHTML=icon('close',18);document.getElementById('drawerClose').addEventListener('click',closeDrawer);document.getElementById('scrim').addEventListener('click',closeDrawer);document.getElementById('mobileMenu').innerHTML=icon('menu',21);document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('mobile-open');document.getElementById('mobileBackdrop').classList.add('open');document.getElementById('mobileMenu').setAttribute('aria-expanded','true')});document.getElementById('mobileBackdrop').addEventListener('click',closeSidebar);document.getElementById('globalSearchIcon').innerHTML=icon('search',16);document.getElementById('globalSearch').addEventListener('click',openSearch);document.getElementById('searchGlyph').innerHTML=icon('search',23);document.getElementById('searchClose').innerHTML=icon('close',19);document.getElementById('searchClose').addEventListener('click',closeSearch);document.getElementById('externalIcon').innerHTML=icon('external',12);document.getElementById('searchResults').addEventListener('click',e=>{const b=e.target.closest('[data-search-type]');if(b){closeSearch();openDrawer(b.dataset.searchType,b.dataset.searchId)}});document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap'||e.target.closest('#modalClose'))closeModal()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeModal();closeDrawer();closeSidebar()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-campaign]')){e.preventDefault();openDrawer('campaign',e.target.dataset.campaign)}});render();
</script>
</body>
</html>
